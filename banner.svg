<svg width="900" height="160" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* DRAW animation - stroke reveal */
    @keyframes draw {
      0%   { stroke-dashoffset: 1400; opacity: 1; fill-opacity: 0; }
      40%  { stroke-dashoffset: 0;    opacity: 1; fill-opacity: 0; }
      60%  { stroke-dashoffset: 0;    opacity: 1; fill-opacity: 1; }
      90%  { stroke-dashoffset: 0;    opacity: 1; fill-opacity: 1; }
      100% { stroke-dashoffset: 0;    opacity: 0; fill-opacity: 0; }
    }

    /* PEAK FLICKER - harder, brighter neon flicker */
    @keyframes flicker {
      0%   { opacity: 0; }
      4%   { opacity: 0; }
      5%   { opacity: 1; }
      7%   { opacity: 0.05; }
      9%   { opacity: 1; }
      11%  { opacity: 0.15; }
      13%  { opacity: 1; }
      15%  { opacity: 0.3; }
      17%  { opacity: 1; }
      22%  { opacity: 1; }
      23%  { opacity: 0.2; }
      24%  { opacity: 1; }
      70%  { opacity: 1; }
      82%  { opacity: 0.85; }
      84%  { opacity: 1; }
      95%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* FLOAT animation - gentle up down */
    @keyframes float {
      0%   { transform: translateY(0px);   opacity: 0; }
      5%   { opacity: 1; }
      25%  { transform: translateY(-8px);  opacity: 1; }
      50%  { transform: translateY(0px);   opacity: 1; }
      75%  { transform: translateY(-8px);  opacity: 1; }
      95% { opacity: 1; }
      100% { transform: translateY(0px);   opacity: 0; }
    }

    /* Rising particles */
    @keyframes particle-rise {
      0%   { transform: translateY(0);   opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-110px); opacity: 0; }
    }

    /* Splash burst - expands and fades, timed to the flicker peak */
    @keyframes splash {
      0%   { transform: scale(0);   opacity: 0; }
      10%  { opacity: 0; }
      12%  { transform: scale(0.2); opacity: 1; }
      35%  { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    /* Splash droplets flying outward */
    @keyframes drip {
      0%   { transform: translate(0,0) scale(0); opacity: 0; }
      11%  { opacity: 0; }
      13%  { transform: translate(0,0) scale(1);      opacity: 1; }
      40%  { transform: var(--end, translate(30px,30px)) scale(0.3); opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes pulse-line {
      0%, 100% { transform: scaleX(0); opacity: 0; }
      50%       { transform: scaleX(1); opacity: 0.6; }
    }

    @keyframes subtitle-pulse {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.9; }
    }

    @keyframes bg-pulse {
      0%, 100% { opacity: 0.15; }
      50%       { opacity: 0.5; }
    }

    /* Phase 1: Draw (0-10s of 30s cycle) */
    .text-draw {
      fill: #ffffff;
      stroke: #00baff;
      stroke-width: 1.5px;
      stroke-dasharray: 1400;
      font-family: monospace;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 12px;
      animation: draw 10s ease-in-out 0s infinite;
      filter: drop-shadow(0 0 8px #00baff) drop-shadow(0 0 16px #0066cc);
    }

    /* Phase 2: Flicker (10-20s) - PEAK */
    .text-flicker {
      fill: #ffffff;
      font-family: monospace;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 12px;
      animation: flicker 10s linear 10s infinite;
      filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 18px #00c8ff)
              drop-shadow(0 0 34px #0080ff) drop-shadow(0 0 55px #0040ff);
      opacity: 0;
    }

    /* Phase 3: Float (20-30s) */
    .text-float {
      fill: #ffffff;
      font-family: monospace;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 12px;
      animation: float 10s ease-in-out 20s infinite;
      filter: drop-shadow(0 0 6px #00baff) drop-shadow(0 0 14px #0066cc);
      opacity: 0;
    }

    .particle { animation: particle-rise linear infinite; }
    .p1 { animation-duration: 4s;   animation-delay: 0s; }
    .p2 { animation-duration: 5.5s; animation-delay: 1s; }
    .p3 { animation-duration: 3.8s; animation-delay: 2s; }
    .p4 { animation-duration: 6s;   animation-delay: 0.5s; }
    .p5 { animation-duration: 4.5s; animation-delay: 1.5s; }
    .p6 { animation-duration: 5s;   animation-delay: 3s; }
    .p7 { animation-duration: 4.2s; animation-delay: 2.5s; }
    .p8 { animation-duration: 6.5s; animation-delay: 0.8s; }
    .p9 { animation-duration: 5.2s; animation-delay: 1.2s; }
    .p10 { animation-duration: 4.8s; animation-delay: 2.8s; }

    .splash {
      animation: splash 10s linear 10s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .drip {
      animation: drip 10s linear 10s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .underline {
      transform-origin: center;
      animation: pulse-line 3s ease-in-out infinite;
    }

    .subtitle {
      animation: subtitle-pulse 3.5s ease-in-out infinite;
    }

    .glow-bg {
      animation: bg-pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="160" fill="#050810"/>

  <!-- Ambient glow behind text -->
  <ellipse class="glow-bg" cx="450" cy="80" rx="360" ry="70" fill="#0060ff" opacity="0.15" filter="blur(20px)"/>

  <!-- Particles -->
  <circle class="particle p1" cx="60"  cy="140" r="1.5" fill="#0088ff"/>
  <circle class="particle p2" cx="150" cy="140" r="1"   fill="#00c8ff"/>
  <circle class="particle p3" cx="260" cy="140" r="2"   fill="#0055cc"/>
  <circle class="particle p4" cx="380" cy="140" r="1.5" fill="#00aaff"/>
  <circle class="particle p5" cx="480" cy="140" r="1"   fill="#00c8ff"/>
  <circle class="particle p6" cx="560" cy="140" r="2"   fill="#0066cc"/>
  <circle class="particle p7" cx="650" cy="140" r="1.5" fill="#0088ff"/>
  <circle class="particle p8" cx="740" cy="140" r="1"   fill="#00c8ff"/>
  <circle class="particle p9" cx="820" cy="140" r="1.8" fill="#0055cc"/>
  <circle class="particle p10" cx="890" cy="140" r="1.2" fill="#0099ff"/>

  <!-- Splash burst rings at peak flicker -->
  <circle class="splash" cx="450" cy="80" r="60" fill="none" stroke="#00c8ff" stroke-width="2" opacity="0"/>
  <circle class="splash" cx="450" cy="80" r="90" fill="none" stroke="#0088ff" stroke-width="1.5" opacity="0" style="animation-delay:10.3s"/>

  <!-- Splash droplets flying outward from center -->
  <circle class="drip" cx="450" cy="80" r="3" fill="#00c8ff" style="--end: translate(-120px,-40px)"/>
  <circle class="drip" cx="450" cy="80" r="2.5" fill="#0099ff" style="--end: translate(120px,-35px)"/>
  <circle class="drip" cx="450" cy="80" r="3" fill="#00e0ff" style="--end: translate(-90px,45px)"/>
  <circle class="drip" cx="450" cy="80" r="2" fill="#0077dd" style="--end: translate(95px,50px)"/>
  <circle class="drip" cx="450" cy="80" r="2.5" fill="#00c8ff" style="--end: translate(-150px,10px)"/>
  <circle class="drip" cx="450" cy="80" r="2" fill="#0099ff" style="--end: translate(150px,-5px)"/>
  <circle class="drip" cx="450" cy="80" r="2.8" fill="#00e0ff" style="--end: translate(-60px,-60px)"/>
  <circle class="drip" cx="450" cy="80" r="2.2" fill="#0077dd" style="--end: translate(65px,60px)"/>

  <!-- Phase 1: DRAW text -->
  <text class="text-draw" x="450" y="95" text-anchor="middle">DEVZIKKY</text>

  <!-- Phase 2: FLICKER text -->
  <text class="text-flicker" x="450" y="95" text-anchor="middle">DEVZIKKY</text>

  <!-- Phase 3: FLOAT text -->
  <text class="text-float" x="450" y="95" text-anchor="middle">DEVZIKKY</text>

  <!-- Underline bar -->
  <rect class="underline" x="210" y="112" width="480" height="1.5" fill="#00baff"/>

  <!-- Subtitle -->
  <text class="subtitle" x="450" y="140" font-family="monospace" font-size="10"
    text-anchor="middle" fill="#2277aa" letter-spacing="5">
    BOT DEVELOPER · WEBSITE CREATOR · OPEN SOURCE
  </text>
</svg>
